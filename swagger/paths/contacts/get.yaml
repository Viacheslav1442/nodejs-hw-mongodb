summary: Отримати список контактів
tags:
  - Contacts
parameters:
  - in: query
    name: page
    schema:
      type: integer
      example: 1
    description: Номер сторінки
  - in: query
    name: limit
    schema:
      type: integer
      example: 10
    description: Кількість контактів на сторінці
  - in: query
    name: favorite
    schema:
      type: boolean
    description: Фільтрація улюблених контактів
responses:
  '200':
    description: Успішна відповідь
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas.yaml#/components/schemas/Contact'
  '401':
    description: Неавторизований доступ
