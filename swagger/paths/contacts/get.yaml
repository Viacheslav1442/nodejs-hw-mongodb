get:
  tags:
    - Contacts
  summary: Отримати всі контакти
  operationId: getContacts
  description: Повертає список всіх контактів
  security:
    - bearerAuth: []
  parameters:
    - name: limit
      in: query
      required: false
      schema:
        type: integer
    - name: offset
      in: query
      required: false
      schema:
        type: integer
  responses:
    '200':
      description: Список контактів
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../components/schemas.yaml#/schemas/Contact'
    '404':
      description: Контакти не знайдено
      content:
        application/json:
          schema:
            $ref: '../../components/schemas.yaml#/schemas/ContactError'
