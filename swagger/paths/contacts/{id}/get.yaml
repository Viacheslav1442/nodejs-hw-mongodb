tags:
  - Contacts
summary: Отримати контакт за ID
operationId: getContactById
description: Повертає контакт за унікальним ідентифікатором
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    description: ID контакту
    schema:
      type: string
responses:
  '200':
    description: Успішна відповідь із даними контакту
  '404':
    description: Контакт не знайдено
