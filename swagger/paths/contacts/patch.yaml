summary: Оновити контакт
tags:
  - Contacts
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        $ref: '../../components/schemas.yaml#/components/schemas/ContactUpdate'
responses:
  '200':
    description: Контакт оновлено
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/components/schemas/Contact'
  '400':
    description: Невірні дані
  '404':
    description: Контакт не знайдено
