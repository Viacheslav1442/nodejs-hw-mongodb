patch:
  tags:
    - Contacts
  summary: Оновити контакт
  operationId: updateContact
  description: Оновлює дані існуючого контакту
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      schema:
        type: string
      description: ID контакту
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/schemas/Contact'
  responses:
    '200':
      description: Контакт оновлено успішно
      content:
        application/json:
          schema:
            $ref: '../../components/schemas.yaml#/schemas/Contact'
    '404':
      description: Контакт не знайдено
      content:
        application/json:
          schema:
            $ref: '../../components/schemas.yaml#/schemas/ContactError'
